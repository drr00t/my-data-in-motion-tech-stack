spring.kafka.consumer.bootstrap-servers=${BOOTSTRAP_SERVERS:localhost:9095}
spring.kafka.consumer.group-id=sb-kfk-csm-films
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.heartbeat.interval.ms=3000
spring.kafka.consumer.max.poll.interval.ms=30000
spring.kafka.consumer.session.timeout.ms=10000




