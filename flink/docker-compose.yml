services:
  jobmanager:
    image: flink:1.20-java17
    hostname: jobmanager
    command: ["jobmanager"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    networks:
      - sakila_net

  taskmanager:
    image: flink:1.20-java17
    hostname: taskmanager
    command: ["taskmanager"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
    ports:
      - "6121:6121"
      - "6122:6122"
      - "8082:8082"
    depends_on:
      - jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    networks:
      - sakila_net

networks:
  sakila_net:
    name: sakila_net
    external: true
