services:
  jobmanager:
    image: flink:1.20-java17
    hostname: jobmanager
    command: ["jobmanager"]
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    networks:
      - sakila_net

  taskmanager:
    image: flink:1.20-java17
    hostname: taskmanager
    command: ["taskmanager"]
    ports:
      - "6121:6121"
      - "6122:6122"
      - "8082:8082"
    depends_on:
      - jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - FLINK_PROPERTIES_jobmanager.rpc.address=jobmanager
      - FLINK_PROPERTIES_jobmanager.rpc.port=6123
      - FLINK_PROPERTIES_jobmanager.memory.process.size=1024m # Adjust memory as needed
    networks:
      - sakila_net

networks:
  sakila_net:
    name: sakila_net
